name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Integration version to release, without the v prefix"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Update manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' \
            custom_components/bureau_of_meteorology/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/bureau_of_meteorology/manifest.json

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add custom_components/bureau_of_meteorology/manifest.json
          git commit -m "chore(release): v${VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Prepare release v${VERSION}" \
            --body "Updates the Home Assistant integration version to v${VERSION}."
